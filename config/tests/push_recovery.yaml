# Forces [N] and torques [Nm] act at the named MuJoCo body's center of mass.
# Timing uses simulation seconds. Edit this list for your robot and test.
# H2: one 50 N lateral force push per mesh-bearing body; no applied torque.
# Head links are H2-specific; remove unavailable links when testing another robot.

