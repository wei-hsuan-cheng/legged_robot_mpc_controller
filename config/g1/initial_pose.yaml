# Crouched spawn for the bring-up: the humanoid equivalent of MIT Cheetah lying
# on its folded legs. A squat with hip = ankle = -0.7 and knee = 1.4 keeps the
# soles flat and the trunk upright, and puts the CoM over the feet (x = +0.061 m
# inside the sole span [-0.011, +0.129] m, by forward kinematics), so a joint-space
# stand-up from it is statically stable.
#
# Use with floatingBaseSource:=state_estimator, which stands up from here. With
# ground_truth_state the MPC starts immediately and expects a standing robot.
g1_joints:
  # Hip, knee, ankle joints
  left_hip_pitch_joint: -0.7
  left_hip_roll_joint: 0.0
  left_hip_yaw_joint: 0.0
  left_knee_joint: 1.4
  left_ankle_pitch_joint: -0.7
  left_ankle_roll_joint: 0.0
  
  right_hip_pitch_joint: -0.7
  right_hip_roll_joint: 0.0
  right_hip_yaw_joint: 0.0
  right_knee_joint: 1.4
  right_ankle_pitch_joint: -0.7
  right_ankle_roll_joint: 0.0

  # Waist joints
  waist_yaw_joint: 0.0
  waist_roll_joint: 0.0
  waist_pitch_joint: 0.0

  # Shoulder, elbow, wrist joints
  # Arms hanging at the sides, matching reference.defaultJointState so the robot
  # spawns in the posture the MPC reference asks it to hold.
  left_shoulder_pitch_joint: 0.2
  left_shoulder_roll_joint: 0.20
  left_shoulder_yaw_joint: 0.0
  left_elbow_joint: 1.20
  left_wrist_roll_joint: 0.0
  left_wrist_pitch_joint: 0.0
  left_wrist_yaw_joint: 0.0

  right_shoulder_pitch_joint: 0.2
  right_shoulder_roll_joint: -0.20
  right_shoulder_yaw_joint: 0.0
  right_elbow_joint: 1.20
  right_wrist_roll_joint: 0.0
  right_wrist_pitch_joint: 0.0
  right_wrist_yaw_joint: 0.0

# Spawn height of the floating base, so the soles start on the floor rather than
# dropping from the 0.793 m the MJCF body is authored at: 0.6422 m by forward
# kinematics for this crouch, plus the same ~2 mm clearance as the standing spawn.
g1_base:
  z: 0.644
