controller_manager:
  ros__parameters:
    update_rate: $(var mrt_freq)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    humanoid_inekf:
      type: legged_robot_state_estimator/HumanoidInEkfController

    humanoid_linear_kf:
      type: legged_robot_state_estimator/HumanoidLinearKfController

    humanoid_whole_body_inverse_dynamics_mpc_controller:
      type: legged_robot_mpc_controller/HumanoidWholeBodyInverseDynamicsMpcController


# Contact-aided right-invariant EKF (Hartley et al. 2018)
humanoid_inekf:
  ros__parameters:
    update_rate: $(var mrt_freq)
    urdfFile: $(var urdf_file)
    baseFrame: pelvis
    # Read by name, so the order is free; the MPC's robot.jointNames.
    jointNames:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint

      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
      
      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint
      
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint

    imuInterfaceName: pelvis_imu
    imuFrame: imu_in_pelvis
    contactFrames:
      [foot_l_heel_est, foot_l_toe_est, foot_r_heel_est, foot_r_toe_est]
    odomTopic: /humanoid/state_estimate/odom
    odomFrame: odom
    publishRate: 100.0

    # When the estimate may take over from ground truth. The timer is the real
    # gate: the filter starts confident (ground-truth seed, small initial
    # covariance) and its biases are barely observable while standing, so no
    # covariance can show it has converged. The std-devs below are divergence
    # guards on the OBSERVABLE states only - yaw and x/y position are gauge
    # states whose covariance grows without bound, so they are not checked.
    readiness:
      minSeconds: 5.0
      rollPitchStdDevMax: 0.10
      heightStdDevMax: 0.10
      velocityStdDevMax: 0.50

    noise:
      gyroscope: 1.0e-2
      accelerometer: 1.5e0
      gyroscopeBias: 1.0e-5
      accelerometerBias: 1.0e-4
      contact: 1.0e-2
      contactPosition: 2.0e-3
      contactRotation: 1.0e-2
    height:
      source: kinematic
      kinematicWeight: 0.9
      anchorUpdateThreshold: 0.05
      groundZ: 0.0
      holdThroughFlight: true
    contact:
      source: scheduled
      footIndices:
        [0, 0, 1, 1]
      beta0:
        [-20.0, -20.0, -20.0, -20.0]
      beta1:
        [0.7, 0.7, 0.7, 0.7]
      forceCovarianceAlpha: 10.0
      probabilityThreshold: 0.5
      dynamicEstimation: false
    lpf:
      gyroCutoff: 80.0
      gyroAccelCutoff: 50.0
      linAccelCutoff: 15.0
      dqJCutoff: 10.0
      ddqJCutoff: 5.0
      tauJCutoff: 10.0


# Two-stage linear KF (Bledt et al. 2018)
humanoid_linear_kf:
  ros__parameters:
    update_rate: $(var mrt_freq)
    urdfFile: $(var urdf_file)
    baseFrame: pelvis
    # Read by name, so the order is free; the MPC's robot.jointNames.
    jointNames:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint

      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint

      - waist_yaw_joint
      - waist_roll_joint
      - waist_pitch_joint

      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint

      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint

    imuInterfaceName: pelvis_imu
    imuFrame: imu_in_pelvis
    contactFrames:
      [foot_l_heel_est, foot_l_toe_est, foot_r_heel_est, foot_r_toe_est]
    odomTopic: /humanoid/state_estimate/odom
    odomFrame: odom
    publishRate: 100.0

    # When the estimate may take over from ground truth. The timer is the real
    # gate: the filter starts confident (ground-truth seed, small initial
    # covariance) and its biases are barely observable while standing, so no
    # covariance can show it has converged. The std-devs below are divergence
    # guards on the OBSERVABLE states only - yaw and x/y position are gauge
    # states whose covariance grows without bound, so they are not checked.
    readiness:
      minSeconds: 5.0
      rollPitchStdDevMax: 0.10
      heightStdDevMax: 0.10
      velocityStdDevMax: 0.50

    # The linear KF needs to know which feet are loaded too.
    contact:
      source: scheduled
      footIndices: [0, 0, 1, 1]

    # 0 = derive from inEKF.contact.footIndices ([0,0,1,1] -> 2 feet).
    # The G1 has 2 FEET but 4 CONTACT POINTS (heel + toe each).
    numFeet: 2
    # 0.0, NOT legged_control's 0.02: that value compensates a SPHERICAL foot
    # whose contact frame sits at the sphere centre (Unitree A1/Go1). The G1's
    # foot_*_est frames are already at the sole (urdf origin z = -0.035 from the
    # ankle), so a radius here biases the estimated base height up by exactly
    # that amount - measured as a +20 mm offset before this was zeroed.
    footRadius: 0.0
    imuProcessNoisePosition: 0.02
    imuProcessNoiseVelocity: 0.02
    footProcessNoisePosition: 0.002
    footSensorNoisePosition: 0.005
    footSensorNoiseVelocity: 0.1
    footHeightSensorNoise: 0.01
    # A swing foot's noise is scaled by this, which is how the filter ignores
    # a foot that is off the ground without resizing the problem.
    swingNoiseMultiplier: 100.0


humanoid_whole_body_inverse_dynamics_mpc_controller:
  ros__parameters:
    update_rate: $(var mrt_freq)

    paths:
      urdfFile: $(var urdf_file)
      libFolder: $(var lib_folder)

    target:
      walkingVelocityTopic: /humanoid/walking_velocity_command
      basePoseTopic: /humanoid/base_pose_command
      modeTopic: /humanoid/target_mode
      defaultMode: base_twist
      globalFrame: odom

    robot:
      commandInterface: effort_pd
      stateInterfaces: [position, velocity, effort]
      jointNames:
        - left_hip_pitch_joint
        - left_hip_roll_joint
        - left_hip_yaw_joint
        - left_knee_joint
        - left_ankle_pitch_joint
        - left_ankle_roll_joint

        - right_hip_pitch_joint
        - right_hip_roll_joint
        - right_hip_yaw_joint
        - right_knee_joint
        - right_ankle_pitch_joint
        - right_ankle_roll_joint

        - waist_yaw_joint
        - waist_roll_joint
        - waist_pitch_joint

        - left_shoulder_pitch_joint
        - left_shoulder_roll_joint
        - left_shoulder_yaw_joint
        - left_elbow_joint

        - right_shoulder_pitch_joint
        - right_shoulder_roll_joint
        - right_shoulder_yaw_joint
        - right_elbow_joint

    control:
      observationVelocityFilterCutoffHz: 30.0
      feedforward: policy_torque
      jointEffortPd:
        kp:
          [200.0, 200.0, 200.0, 200.0, 200.0, 200.0,
           200.0, 200.0, 200.0, 200.0, 200.0, 200.0,
           200.0, 200.0, 200.0,
           200.0, 200.0, 200.0, 200.0,
           200.0, 200.0, 200.0, 200.0]
        kd:
          [20.0, 20.0, 20.0, 10.0, 20.0, 20.0,
           20.0, 20.0, 20.0, 10.0, 20.0, 20.0,
           20.0, 20.0, 20.0,
           20.0, 20.0, 20.0, 20.0,
           20.0, 20.0, 20.0, 20.0]

    diagnostics:
      statusLogPeriod: 2.0

    floatingBase:
      source: $(var floating_base_source)
      estimator: $(var floating_base_estimator)
      stateInterfaceName: pelvis
      imuInterfaceName: pelvis_imu

    bringUp:
      autoStart: true
      standUpSeconds: 3.0
      settleSeconds: 0.5
      settleGyroMax: 0.10
      settleAccelTolerance: 0.5
      settleFilterHz: 2.0
      blendSeconds: 0.5
      tiltLimit: 0.8

    ocs2:
      interface:
        verbose: false

      codegen:
        verbose: true
        recompileLibraries: false

      model:
        robotName: g1

        fixedJointNames:
          - left_wrist_roll_joint
          - left_wrist_pitch_joint
          - left_wrist_yaw_joint
          - right_wrist_roll_joint
          - right_wrist_pitch_joint
          - right_wrist_yaw_joint

        contactNames6DoF: 
          [foot_l_contact, foot_r_contact]
        contactParentJointNames: 
          [left_ankle_roll_joint, right_ankle_roll_joint]
        contactGeometry:
          frameTranslation: [0.035, 0.0, -0.035]
          rectangle: [0.09, -0.09, 0.03, -0.03]

      solver:
        sqp:
          nThreads: 5
          dt: 0.02
          sqpIteration: 1
          deltaTol: 0.0001
          g_max: 0.01
          g_min: 0.000001
          projectStateInputEqualityConstraints: true
          printSolverStatistics: true
          printSolverStatus: false
          printLinesearch: false
          useFeedbackPolicy: false
          integratorType: RK4
          threadPriority: 50

        rollout:
          policyTimeOffset: 0.000

      mpc:
        solverType: sqp
        mpcDesiredFrequency: $(var mpc_freq)
        mrtDesiredFrequency: $(var mrt_freq)
        timeHorizon: 1.0
        solutionTimeWindow: -1.0
        coldStart: false
        debugPrint: false

      costs:
        qScaling: 1.0
        rScaling: 0.001
        terminalCostScaling: 1.0
        
        # Q/Qf on x = [base pose, joint positions, base velocity, joint velocities].
        # Base pose: [x, y, z, yaw, pitch, roll].
        # Base velocity: [vx, vy, vz, yaw rate, pitch rate, roll rate] (Euler rates).
        q:
          basePose: [0.0, 0.0, 50.0, 0.0, 100.0, 100.0]
          baseVelocity: [30.0, 15.0, 5.0, 30.0, 30.0, 30.0]
          jointPositions:
            [0.05, 0.2, 15.0, 0.1, 0.1, 0.1,
             0.05, 0.2, 15.0, 0.1, 0.1, 0.1,
             2.0, 2.0, 2.0,
             5.0, 5.0, 2.0, 4.0,
             5.0, 5.0, 2.0, 4.0]
          jointVelocities:
            [0.001, 0.001, 0.001, 0.001, 0.001, 0.001,
             0.001, 0.001, 0.001, 0.001, 0.001, 0.001,
             0.2, 0.2, 0.2,
             0.06, 0.06, 0.06, 0.06,
             0.06, 0.06, 0.06, 0.06]

        qFinal:
          basePose: [0.0, 0.0, 50.0, 0.0, 100.0, 100.0]
          baseVelocity: [30.0, 15.0, 5.0, 30.0, 30.0, 30.0]
          jointPositions:
            [0.05, 0.1, 30.0, 0.1, 0.1, 0.1,
             0.05, 0.1, 30.0, 0.1, 0.1, 0.1,
             2.0, 2.0, 2.0,
             5.0, 5.0, 2.0, 4.0,
             5.0, 5.0, 2.0, 4.0]
          jointVelocities:
            [0.001, 0.001, 0.001, 0.001, 0.001, 0.001,
             0.001, 0.001, 0.001, 0.001, 0.001, 0.001,
             0.2, 0.2, 0.2,
             0.02, 0.02, 0.02, 0.02,
             0.02, 0.02, 0.02, 0.02]

        # R on u = [wrench_left, wrench_right, base acceleration, joint acceleration, joint torque].
        # Contact wrench order per foot: [fx, fy, fz, mx, my, mz].
        r:
          contactWrenches:
            [0.003, 0.003, 0.001, 0.01, 0.01, 5.0,
             0.003, 0.003, 0.001, 0.01, 0.01, 5.0]
          baseAccelerations: [0.005, 0.005, 0.005, 0.005, 0.005, 0.005]
          jointAccelerations:
            [0.005, 0.005, 0.005, 0.005, 0.005, 0.005,
             0.005, 0.005, 0.005, 0.005, 0.005, 0.005,
             0.005, 0.005, 0.005,
             0.005, 0.005, 0.005, 0.005,
             0.005, 0.005, 0.005, 0.005]
          jointTorques:
            [0.0005, 0.0005, 0.0005, 0.0005, 0.0005, 0.0005,
             0.0005, 0.0005, 0.0005, 0.0005, 0.0005, 0.0005,
             0.005, 0.005, 0.005,
             0.05, 0.05, 0.05, 0.05,
             0.05, 0.05, 0.05, 0.05]

        # Flat-foot/task-space adaptations beyond the papers' state/input objective.
        taskSpaceFootCost:
          activate: true
          weights:
            [0.0, 0.0, 0.0, 50.0, 50.0, 0.0,
             5.0, 5.0, 0.0, 1.0, 1.0, 0.005]

        # Cartesian pose/twist tracking costs
        taskSpaceCosts:
          names:
            [torso]

          torso:
            activate: false
            linkName: mid360_link
            weights:
              [0.0, 0.0, 0.0, 100.0, 100.0, 0.0,
               0.1, 0.1, 0.005, 5.0, 5.0, 2.0]

        # Torso soft stabilization, not a hard upright constraint or a CoM-position target.
        torsoTiltCost:
          activate: true
          linkName: torso_link
          freeTiltAngle: 0.17453292519943295  # 10 degrees; soft lean corridor.
          tiltWeight: 10.0
          angularVelocityWeight: 5.0

        # Active J_leg^T W load cost; separate from r.jointTorques.
        legTorqueCost:
          activate: false  # Initial terrain ablation; input torque cost and actuator limits remain.
          scaling: 0.001
          leftActiveJointNames:
            - left_hip_pitch_joint
            - left_hip_roll_joint
            - left_hip_yaw_joint
            - left_knee_joint
            - left_ankle_pitch_joint
            - left_ankle_roll_joint
          leftWeights: 
            [2.0, 2.0, 1.0, 8.0, 0.2, 0.2]
          rightActiveJointNames:
            - right_hip_pitch_joint
            - right_hip_roll_joint
            - right_hip_yaw_joint
            - right_knee_joint
            - right_ankle_pitch_joint
            - right_ankle_roll_joint
          rightWeights: 
            [2.0, 2.0, 1.0, 8.0, 0.2, 0.2]

      constraints:
        inverseDynamics:
          # Keep physical equalities enabled for locomotion; disabling is diagnostic-only.
          activate: true
          torqueConstraintNodes: 3

        footMotionEquality:
          activate: true
          # Hard equalities, not cost weights or inequalities.
          # Stance: keep the foot still and correct height/tilt.
          # Swing: follow the vertical foot path.
          positionErrorGain_z: 50.0              # Height correction; lower gains give slower correction.
          orientationErrorGain: 100.0            # Tilt correction; lower gains avoid fighting shallow inclines.
          linearVelocityErrorGain_z: 50.0        # Vertical speed damping.
          linearVelocityErrorGain_xy: 50.0       # Horizontal speed damping in stance.
          angularVelocityErrorGain: 50.0         # Rotation damping in stance.
          linearAccelerationErrorGain_z: 1.0     # Vertical acceleration multiplier; keep positive.
          linearAccelerationErrorGain_xy: 1.0    # Horizontal acceleration multiplier in stance; keep positive.
          angularAccelerationErrorGain: 1.0      # Rotation acceleration multiplier in stance; keep positive.
        
        swingFootZeroWrench:
          activate: true

        frictionCone:
          activate: true
          frictionCoefficient: 0.4
          mu: 0.2
          delta: 5.0

        contactMomentXY:
          activate: true
          mu: 0.6
          delta: 0.03

        jointPositionLimits:
          activate: true
          # Lower/upper joint position bounds come from the URDF.
          mu: 1200.0
          delta: 0.1

        jointVelocityLimits:
          activate: true
          # Symmetric bounds are velocityScaling * URDF joint velocity limits; 0 < scaling <= 1.
          velocityScaling: 1.0
          mu: 0.1
          delta: 1.0

        jointTorqueLimits:
          activate: true
          # Scales URDF or override bounds for both the OCP penalty and feedforward clipping; 0 < scaling <= 1.
          torqueScaling: 1.0
          # Omit limits to use URDF joint <limit effort="..."> values for OCP bounds and feedforward clipping.
          # To override, uncomment a full positive array in robot.jointNames order [Nm].
          # limits: [88.0, 139.0, 88.0, 139.0, 50.0, 50.0,
          #          88.0, 139.0, 88.0, 139.0, 50.0, 50.0,
          #          88.0, 50.0, 50.0,
          #          25.0, 25.0, 25.0, 25.0,
          #          25.0, 25.0, 25.0, 25.0]
          mu: 0.1
          delta: 5.0

        # Arm versus torso/pelvis/head only; independent of legSelfCollision.
        armSelfCollision:
          activate: true
          minimumDistance: 0.015
          # Polynomial is inactive beyond minimumDistance + delta; avoids spreading the arms at rest.
          implementation: polynomial
          # Polynomial boundary slope = -mu*delta/2 = -30; violation curvature = mu = 6000.
          # For rbf, start separately with mu: 0.01, delta: 0.02 (curvature mu/delta^2 = 25).
          mu: 6000.0
          # A narrower buffer leaves the nominal 28.6 mm arm/body gap unpenalized.
          delta: 0.01
          arms:
            # Selected upper-arm/forearm/hand volumes, excluding mechanical shoulder attachments.
            names:
              [left_upper_arm_0, left_upper_arm_1, left_forearm_0, left_forearm_1,
               left_forearm_2, left_hand_0, left_hand_1, left_hand_2,
               right_upper_arm_0, right_upper_arm_1, right_forearm_0, right_forearm_1,
               right_forearm_2, right_hand_0, right_hand_1, right_hand_2]
            left_upper_arm_0:
              linkName: left_shoulder_yaw_link
              center: [0.008, 0.0, -0.035]
              radius: 0.047
            left_upper_arm_1:
              linkName: left_shoulder_yaw_link
              center: [0.008, 0.0, -0.09]
              radius: 0.047
            left_forearm_0:
              linkName: left_elbow_link
              center: [0.01, 0.0, -0.005]
              radius: 0.04
            left_forearm_1:
              linkName: left_elbow_link
              center: [0.065, 0.0, -0.005]
              radius: 0.04
            left_forearm_2:
              linkName: left_elbow_link
              center: [0.1, 0.0, -0.005]
              radius: 0.04
            left_hand_0:
              linkName: left_rubber_hand
              center: [0.025, -0.012, 0.008]
              radius: 0.052
            left_hand_1:
              linkName: left_rubber_hand
              center: [0.075, -0.012, 0.008]
              radius: 0.052
            left_hand_2:
              linkName: left_rubber_hand
              center: [0.115, -0.012, 0.008]
              radius: 0.052
            right_upper_arm_0:
              linkName: right_shoulder_yaw_link
              center: [0.008, 0.0, -0.035]
              radius: 0.047
            right_upper_arm_1:
              linkName: right_shoulder_yaw_link
              center: [0.008, 0.0, -0.09]
              radius: 0.047
            right_forearm_0:
              linkName: right_elbow_link
              center: [0.01, 0.0, -0.005]
              radius: 0.04
            right_forearm_1:
              linkName: right_elbow_link
              center: [0.065, 0.0, -0.005]
              radius: 0.04
            right_forearm_2:
              linkName: right_elbow_link
              center: [0.1, 0.0, -0.005]
              radius: 0.04
            right_hand_0:
              linkName: right_rubber_hand
              center: [0.025, 0.012, 0.008]
              radius: 0.052
            right_hand_1:
              linkName: right_rubber_hand
              center: [0.075, 0.012, 0.008]
              radius: 0.052
            right_hand_2:
              linkName: right_rubber_hand
              center: [0.115, 0.012, 0.008]
              radius: 0.052
          bodies:
            names:
              [torso_0, torso_1, torso_2, pelvis_0,
               pelvis_1, head]
            torso_0:
              linkName: torso_link
              center: [0.0, 0.0, 0.035]
              radius: 0.1
            torso_1:
              linkName: torso_link
              center: [0.0, 0.0, 0.13]
              radius: 0.1
            torso_2:
              linkName: torso_link
              center: [0.0, 0.0, 0.225]
              radius: 0.1
            pelvis_0:
              linkName: pelvis
              center: [0.0, -0.025, -0.075]
              radius: 0.08
            pelvis_1:
              linkName: pelvis
              center: [0.0, 0.025, -0.075]
              radius: 0.08
            head:
              linkName: head_link
              center: [0.005, 0.0, 0.42]
              radius: 0.115

        legSelfCollision:
          activate: true
          leftAnkleFrame: left_ankle_roll_joint
          rightAnkleFrame: right_ankle_roll_joint
          footCollisionSphereRadius: 0.065
          leftKneeFrame: left_knee_joint
          rightKneeFrame: right_knee_joint
          kneeCollisionSphereRadius: 0.07
          # Keep airborne feet on their own side; 3D sphere distance alone permits crossover.
          minimumLateralSeparation: 0.09
          mu: 3000.0
          delta: 0.02

      reference:
        targetDisplacementVelocity: 0.5
        targetRotationVelocity: 0.5
        maxDisplacementVelocityX: 1.0
        maxDisplacementVelocityY: 0.5
        maxRotationVelocity: 1.5708
        defaultBaseHeight: 0.795
        minBaseHeight: 0.395
        maxBaseHeight: 1.195
        basePosePositionTolerance: 0.02
        basePoseOrientationTolerance: 0.03
        
        # Slew limits on the scaled walking command: ax, ay [m/s^2], height rate [m/s], yaw acceleration [rad/s^2]
        velocityCommandRateLimits:
          [0.5, 0.5, 0.5, 2.0]
        
        groundHeight:
          useEstimate: false
          maxStepPerSolve: 0.002

        armSwing:
          jointNames:
            - left_shoulder_pitch_joint
            - right_shoulder_pitch_joint
            - left_elbow_joint
            - right_elbow_joint

        # Nominal joint posture for reference generation; pelvis height is defaultBaseHeight.
        defaultJointState:
          [-0.8, 0.0, 0.0, 1.6, -0.8, 0.0,
           -0.8, 0.0, 0.0, 1.6, -0.8, 0.0,
            0.0, 0.0, 0.0,
           0.20, 0.20, 0.0, 1.20,
           0.20, -0.20, 0.0, 1.20]

      gait:
        phaseTransitionStanceTime: 0.0
        stairClimbingFile: $(var stair_climbing_file)
        terrainWalkingFile: $(var terrain_walking_file)
        initialModeSequence: [STANCE, STANCE]
        initialEventTimes: [0.5]
        defaultModeSequence: [STANCE]
        defaultSwitchingTimes: [0.0, 0.5]

        # Swing-foot trajectory, shared by every template.
        swingTrajectory:
          liftOffVelocity: 0.05
          touchDownVelocity: -0.0
          swingHeight: 0.08 # default fallback for templates that omit swingHeight; 0.08 [m] is the walk value.
          touchDownHeightOffset: -0.001
          swingTimeScale: 0.4
          impactProximityFactorLiftOffVelocity: -0.15
          impactProximityFactorTouchDownVelocity: 0.3
          impactProximityFactorMidPointValue: 0.0

        # Gait templates: N modes and N+1 switching times [s], repeated with period last - first.
        # STANCE = both feet in contact, LF = left foot in contact (right swings), RF = right, FLY = none.
        # Preserve slow walking; quicker supported steps bridge into the flight gait.
        templates:
          # Optional swingHeight [m] per gait; omitted or -1 uses swingTrajectory.swingHeight.
          # The existing swingTimeScale still reduces clearance for short swings.
          names: [stance, left_leg, right_leg, trot, fast_trot, slow_trot, slower_trot, walk, fast_walk, slow_walk, very_slow_walk, run, fast_run, skip, jump, terrain_walk]
          stance:         {modeSequence: [STANCE],                   switchingTimes: [0.0, 0.5]}
          left_leg:       {modeSequence: [LF],                       switchingTimes: [0.0, 0.5]}
          right_leg:      {modeSequence: [RF],                       switchingTimes: [0.0, 0.5]}

          walk:           {modeSequence: [LF, STANCE, RF, STANCE],   switchingTimes: [0.0, 0.3, 0.4, 0.7, 0.8], swingHeight: 0.08}
          fast_walk:      {modeSequence: [LF, STANCE, RF, STANCE],   switchingTimes: [0.0, 0.3, 0.5, 0.8, 1.0]}
          slow_walk:      {modeSequence: [LF, STANCE, RF, STANCE],   switchingTimes: [0.0, 0.4, 0.55, 0.95, 1.1]}
          very_slow_walk: {modeSequence: [RF, STANCE, LF, STANCE],   switchingTimes: [0.0, 0.7, 1.1, 1.8, 2.2]}
          
          trot:           {modeSequence: [LF, RF],                   switchingTimes: [0.0, 0.5, 1.0], swingHeight: 0.09}
          fast_trot:      {modeSequence: [LF, RF],                   switchingTimes: [0.0, 0.4, 0.8]}
          slow_trot:      {modeSequence: [LF, RF],                   switchingTimes: [0.0, 0.55, 1.1]}
          slower_trot:    {modeSequence: [LF, RF],                   switchingTimes: [0.0, 0.6, 1.2]}

          # 0.25 s single support, then 0.08 s with both feet in swing.
          run:            {modeSequence: [LF, FLY, RF, FLY],         switchingTimes: [0.0, 0.25, 0.33, 0.58, 0.66], swingHeight: 0.1}
          fast_run:       {modeSequence: [LF, FLY, RF, FLY],         switchingTimes: [0.0, 0.3, 0.4, 0.7, 0.8]}
          skip:           {modeSequence: [LF, FLY, LF, RF, FLY, RF], switchingTimes: [0.0, 0.25, 0.3, 0.5, 0.75, 0.8, 1.0]}
          jump:           {modeSequence: [STANCE, FLY],              switchingTimes: [0.0, 0.3, 0.5]}
          terrain_walk:   {modeSequence: [LF, STANCE, RF, STANCE],   switchingTimes: [0.0, 0.6, 0.7, 1.3, 1.4]}

        # ---- Gait selection: which template runs, and when ------------------------------
        # ProceduralMpcMotionManager picks a template from `ladder` once per MPC solve,
        # from the commanded velocity (scaled to m/s, rate limited and filtered) and the
        # measured base velocity:
        #   - the ladder is ordered slowest -> fastest and must start with `stance`; the FSM
        #     moves at most one rung per change;
        #   - UP one rung when the command leaves the current rung's band upward
        #     (|vx| or |vy| > linearVelocity max, or |yaw| > yawRate max) AND the measured
        #     speed is near that top (|vx| or |vy| > max - margin, or |yaw rate| > yaw max - margin);
        #   - DOWN one rung when the command is below the band's min on all axes AND the
        #     measured speed is below min + margin on all axes;
        #   - overlapping bands give hysteresis between neighbouring rungs.
        # The command is in the heading frame; the measured values are the pelvis velocity
        # in world axes and the yaw Euler rate.
        # Units are m/s and rad/s; 10.0 stands for "no limit". A margin of 10 (stance) means
        # the robot leaves stance on the command alone.
        #
        # Common things to tune:
        #   - a rung's bands (transitions.<gait>): the speeds at which it engages and disengages;
        #   - measuredMargin: how close the measured speed must come to a band's top before
        #     escalating (larger = escalate on the command alone, smaller = wait for the robot);
        #   - minDwellTime: a change only takes effect after the splice delay below (0.7 s
        #     here), so a dwell shorter than that lets the next change be requested before
        #     the previous one has started;
        #   - switchDelayHorizonFraction: smaller reacts sooner, larger gives the solver more
        #     of the horizon to prepare for the new contact pattern;
        #   - `ladder`: any templates from templates.names, so a rung can use a different contact pattern.
        transitions:
          # Minimum time between two gait changes [s].
          minDwellTime: 0.2
          # A new gait starts at the first contact event after
          # initTime + switchDelayHorizonFraction * horizon (0.3 of a 1.0 s horizon = 0.3 s).
          switchDelayHorizonFraction: 0.3
          ladder: [stance, walk, trot, run]
          #             linearVelocity [m/s]          yawRate [rad/s]        measuredMargin [lin, yaw]
          # Start walking at 0.03 m/s, return to stance below 0.02 m/s.
          stance:       {linearVelocity: [-0.1, 0.03], yawRate: [-0.1, 0.1],  measuredMargin: [10.0, 10.0]}
          walk:         {linearVelocity: [0.02, 0.45], yawRate: [0.05, 10.0], measuredMargin: [0.05, 0.05]}
          trot:         {linearVelocity: [0.40, 0.75], yawRate: [0.65, 10.0], measuredMargin: [0.2, 0.2]}
          run:          {linearVelocity: [0.70, 10.0], yawRate: [10.0, 10.0], measuredMargin: [0.05, 0.05]}

    visualization:
      frameId: odom
      update_rate: 30.0
      optimizedStateRobotModelsActivate: true
      optimizedStateRobotModelsInterval: 0.2 # [s]
      collisionSpheres:
        activate: true
        markerTopic: /performance_visualization/collisionSpheres
        alpha: 0.25
      trajectory:
        activate: true
        markerTopic: /performance_visualization/optimizedStateTrajectory
        frame_names:
          - pelvis
          - mid360_link
          - left_wrist_yaw_link
          - right_wrist_yaw_link
          - foot_l_contact
          - foot_r_contact
        lineWidth: 0.005
        pointScale: 0.01
