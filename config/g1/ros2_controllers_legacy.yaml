        stairClimbingFile: $(var stairClimbingFile)
        terrainWalkingFile: $(var terrainWalkingFile)
        initialModeSequence:
          [STANCE, STANCE]
        initialEventTimes:
          [0.5]
        defaultModeSequence:
          [STANCE]
        defaultSwitchingTimes: [0.0, 0.5]

    visualization:
      frameId: world
      update_rate: 30.0
      trajectory:
        activate: true
        markerTopic: /performance_visualization/optimizedStateTrajectory
        frame_names:
