# Upkie's spawn pose (robot.launch.py's default initial_pose_file): kneeling idle. Spawned upright with these joints,
# the robot settles forward onto its knee-motor housings and both wheels, and the planned stand-up
# (stand_up_trajectory.yaml, bringUp.standUpTrajectoryFile) starts from the state it settles into. Spawn height from
# plan_stand_up.py (lowest collision bounding sphere 1 cm above the floor). See docs/wheeled_biped_handoff.md.
# 0.080 m wheels: hip -1.0 / knee -2.2 (was -1.3 / -2.4): tipping onto the knees from knee 2.4 pushes the knee to
# 2.57 rad and the tire 5.6 mm into the femur; from 2.2 the tire stays clear (plan_stand_up.py IDLE).
upkie_joints:
  left_hip: -1.0
  left_knee: -2.2
  left_wheel: 0.0
  right_hip: 1.0
  right_knee: 2.2
  right_wheel: 0.0
upkie_base:
  z: 0.2209
