# Pineapple's hard course along world +x (tests/tuning/pineapple_suite.py, generate_upkie_course.py format; the MJCF is
# generated at run time): a rough field (rough_tiles.yaml), a ramp up, a 20 mm step up and a 30 mm step down, both head-on
# (both tires at once), a ramp down, then a 120 mm ramp under the left (+y) tire only (tires at y = +-0.227 m).
upkie_course:
  half_width: 3.0
  tiles: rough_tiles.yaml
  uneven_fields:
    - {name: rough, x: [0.8, 3.0], seed: 11}
  ramps:
    - {name: ramp_up, x: [3.2, 4.0], z: [0.0, 0.06]}
    - {name: ramp_down, x: [5.5, 6.3], z: [0.05, 0.0]}
    - {name: one_wheel_ramp_up, x: [6.9, 7.7], z: [0.0, 0.12], y: [0.07, 0.40]}
    - {name: one_wheel_ramp_down, x: [7.7, 8.5], z: [0.12, 0.0], y: [0.07, 0.40]}
  plateaus:
    - {name: plateau_a, x: [4.0, 4.5], top: 0.06}
    - {name: step_high, x: [4.5, 5.0], top: 0.08}
    - {name: plateau_b, x: [5.0, 5.5], top: 0.05}
  friction: [0.8, 0.005, 0.0001]
