# Upkie joystick-demo course along world +x (the robot spawns at the origin facing +x): an uneven field, a ramp up,
# a plateau with a 1 cm step up and down, and a ramp down, all full width (both wheels); then a narrow ramp up to
# 10 cm and down (7.1 degrees) under the +y wheel only (wheels at y = +-0.19 m when driving along y = 0), the other
# wheel staying on the floor. Flat floor behind the spawn (the stand-up catch can roll back over 1 m) and beyond x = 7.0 m.
upkie_course:
  half_width: 3.0                # every feature spans y = -3..3 m, so turning does not leave the course
  tiles: uneven_terrain_params.yaml  # tile style of the uneven fields (relative to this file)
  uneven_fields:
    - {name: uneven_front, x: [0.5, 1.5], seed: 7}
  ramps:                         # top face from (x0, z0) to (x1, z1); y: [y0, y1] narrows one (default full width)
    - {name: ramp_up, x: [1.6, 2.4], z: [0.0, 0.04]}
    - {name: ramp_down, x: [4.0, 4.8], z: [0.04, 0.0]}
    - {name: one_wheel_ramp_up, x: [5.4, 6.2], z: [0.0, 0.10], y: [0.04, 0.34]}
    - {name: one_wheel_ramp_down, x: [6.2, 7.0], z: [0.10, 0.0], y: [0.04, 0.34]}
  plateaus:
    - {name: plateau_low_a, x: [2.4, 2.9], top: 0.04}
    # 1 cm step: 4 cm made the robot fall; 2 cm head-on (both wheels at once) stalled at 0.15 m/s, fell at 0.2-0.3 m/s
    - {name: step_high, x: [2.9, 3.5], top: 0.05}
    - {name: plateau_low_b, x: [3.5, 4.0], top: 0.04}
  friction: [0.8, 0.005, 0.0001]
