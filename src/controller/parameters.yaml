# Standalone WB-ID parameters: x = [base pose, joints, base velocity, joint velocities].
# u = [contact wrenches, base acceleration, joint acceleration, joint torque].
# Pose uses Euler ZYX coordinates; base angular state entries are Euler rates.
# All running/terminal state weights and input weights live under ocs2.costs.
humanoid_whole_body_inverse_dynamics_mpc_controller:
  paths:
    urdfFile: {type: string, default_value: "", description: "Robot URDF used by Pinocchio and robot_state_publisher"}
    libFolder: {type: string, default_value: "/tmp/legged_robot_mpc_cppad", description: "CppAD code generation
        output folder"}
    geometryFile: {type: string, default_value: "", description: "Optional wheeled-biped geometry YAML (a geometry
        map: wheel radius, half_width, center_offset, axle_axis; knee_housings). When set it supplies
        ocs2.constraints.wheelContact.radius/axleAxis and ocs2.model.contactGeometry.frameTranslation, which must
        then be left out of the parameter file, and the stand-up plan and posture table must have been generated for
        it. Shared with the state estimator and the offline generators, e.g. config/upkie/geometry.yaml"}
  target:
    walkingVelocityTopic: {type: string, default_value: "/humanoid/walking_velocity_command", description: "Walking
        velocity command topic"}
    basePoseTopic: {type: string, default_value: "/humanoid/base_pose_command", description: "Absolute floating-base
        geometry_msgs/PoseStamped command topic"}
    modeTopic: {type: string, default_value: "/humanoid/target_mode", description: "Explicit target mode command
        topic; accepts base_twist or base_pose"}
    defaultMode: {type: string, default_value: "base_twist", description: "Target mode selected when the controller
        starts", validation: {one_of<>: [["base_twist", "base_pose"]]}}
    globalFrame: {type: string, default_value: "world", description: "Global frame used by MPC base-pose targets"}
    commandFrame: {type: string, default_value: "", description: "Name of the control frame commands are given in,
        fixed to the base and turned by commandFrameYaw; the launch publishes it as a static TF child of the base.
        Empty: commands are in the base frame"}
    commandFrameYaw: {type: double, default_value: 0.0, description: "Rotation [rad] of that control frame about the
        base z axis. Twist commands (vx, vy) are rotated into the base frame and base pose commands give the control
        frame's orientation; planning and estimation stay in the base frame. Upkie: pi, so +x points away from the
        knees"}
    gaitTopic: {type: string, default_value: "/humanoid/gait_command", description: "std_msgs/String: a gait template
        name held instead of the velocity ladder (e.g. a hop); an empty string returns to the ladder. Empty topic
        name = no subscription"}
    mpcTargetsTopic: {type: string, default_value: "/humanoid/mpc_targets", description: "ocs2_msgs/MpcTargets command
        topic (command_type dispatch: joint arm targets or default posture)"}
  robot:
    jointNames: {type: string_array, default_value: [], description: "Actuated joint names controlled by WB inverse-dynamics
        MPC", validation: {unique<>: null}}
    commandInterface: {type: string, default_value: "effort_pd", description: "Hybrid joint servo command interfaces:
        position, velocity, effort", validation: {one_of<>: [[effort_pd]]}}
    stateInterfaces: {type: string_array, default_value: ["position", "velocity", "effort"], description: "Per-joint
        state interfaces required from ros2_control"}
  control:
    observationVelocityFilterCutoffHz: {type: double, default_value: 0.0, description: "Low-pass cutoff for observed
        generalized velocities [Hz]; 0 disables the filter (raw velocities)", validation: {gt_eq: [0.0]}}
    feedforward: {type: string, default_value: "policy_torque", description: "policy_torque: interpolated MPC joint
        torque inside the constrained window, planned-state RNEA outside it; inverse_dynamics: RNEA at the measured
        state", validation: {one_of<>: [["policy_torque", "inverse_dynamics"]]}}
    jointEffortPd:
      kp: {type: double_array, default_value: [], description: "Position gains of the effort_pd joint servo,
          index-aligned with robot.jointNames. Written to the <joint>/kp command interfaces every tick, in every
          bring-up phase; the hardware runs the PD at its own rate. Empty (with kd): do not claim them and keep
          the hardware's gains (effort_pd_kp in the xacro).", validation: {lower_element_bounds<>: [0.0]}}
      kd: {type: double_array, default_value: [], description: "Velocity gains of the effort_pd joint servo,
          index-aligned with robot.jointNames; see kp.", validation: {lower_element_bounds<>: [0.0]}}
  diagnostics:
    statusLogPeriod: {type: double, default_value: 5.0, description: "Period of the MPC timing/utilization status
        log [s]", validation: {gt: [0.0]}}
    trackingRate: {type: double, default_value: 0.0, description: "Rate [Hz] of the tracking debug topic
        ~/tracking (std_msgs/Float64MultiArray; column names on ~/tracking_names): the MPC policy at the current
        time, the joint command sent to the hardware and the measured / estimated state, in joint and Cartesian
        space. Also enables ~/solver (names on ~/solver_names): per solve, the solve time, the SQP performance
        indices, the equality violation per constraint term and every cost / soft-constraint term at the first
        node. 0 disables both.", validation: {gt_eq: [0.0]}}
    contactSensorNames: {type: string_array, default_value: [], description: "Simulation contact sensors (one per
        contact, in contact order) whose normal_force and contact state interfaces are logged on ~/tracking as
        meas_contact/<sensor>/normal_force and /contact. Claimed only when trackingRate > 0; empty logs none"}
  floatingBase:
    source: {type: string, default_value: "ground_truth_state", description: "Where the floating-base state comes
        from. ground_truth_state = the simulator/hardware body state (ground truth in MuJoCo). state_estimator =
        the estimator controller named by floatingBase.estimator, read through its exported state interfaces (the
        controller manager runs it before this controller, so it is this tick's estimate). It drives control from
        the end of the bring-up's Converge phase; nothing reads ground truth in this mode.", validation: {
          one_of<>: [["ground_truth_state", "state_estimator"]]}}
    estimator: {type: string, default_value: "none", description: "Estimator controller whose exported state interfaces
        are read: humanoid_inekf (contact-aided invariant EKF), humanoid_linear_kf (two-stage linear KF), or none.
        It is a separate ros2_control controller with its own block in config/g1/ros2_controllers.yaml, and must
        be active before this one. Required when source is state_estimator; with ground_truth_state it is still
        read, so its estimate is logged against ground truth.", validation: {one_of<>: [["none", "humanoid_inekf",
            "humanoid_linear_kf"]]}}
    stateInterfaceName: {type: string, default_value: "pelvis", description: "ros2_control state-interface prefix
        of the ground-truth floating-base body. Drives control with ground_truth_state. With state_estimator it
        is read for the diagnostics log only - never for control - and may be left empty on a robot that exports
        no body pose."}
    imuInterfaceName: {type: string, default_value: "pelvis_imu", description: "ros2_control IMU sensor prefix read
        by the bring-up: the stand's gravity compensation uses its attitude, rest detection its gyro and accelerometer."}
    imuFrame: {type: string, default_value: "", description: "URDF frame of that IMU. With state_estimator the
        bring-up removes its mounting rotation from the attitude it reads; empty: the IMU is aligned with the base."}
  bringUp:
    autoStart: {type: bool, default_value: true, description: "With a planned stand-up: automatically start the first
        cycle only (later cycles always need an operator request). With humanoid state_estimator: run bring-up by itself.
        Set false on hardware, where the operator calls ~/stand_up (Passive -> StandUp) and then ~/start_locomotion
        once the robot is on its feet (Settle -> Converge, after which the MPC starts by itself when the estimator
        is ready)."}
    standUpSeconds: {type: double, default_value: 3.0, description: "Time to interpolate the joints from the pose
        measured on leaving Passive to reference.defaultJointState [s]. Joint-space with IMU-attitude gravity compensation,
        so it needs no floating-base state.", validation: {gt_eq: [0.0]}}
    settleSeconds: {type: double, default_value: 0.5, description: "How long the trunk must stay at rest (per the
        IMU tests below) before the estimator may be initialised [s]. Its stance initialisation assumes the robot
        is at rest.", validation: {gt_eq: [0.0]}}
    settleGyroMax: {type: double, default_value: 0.10, description: "At rest: low-passed IMU angular speed below
        this [rad/s]. Zero-velocity detection on the trunk, not the joints - the ankles chatter at tens of Hz under
        the stiff joint servo while the trunk is still. Measured holding the stand in sim: 0.07 peak after a 5 Hz
        low-pass.", validation: {gt: [0.0]}}
    settleAccelTolerance: {type: double, default_value: 0.5, description: "At rest: low-passed accelerometer magnitude
        within this of g [m/s^2].", validation: {gt: [0.0]}}
    settleFilterHz: {type: double, default_value: 2.0, description: "Cutoff of the first-order low-pass applied
        to the IMU rest tests [Hz].", validation: {gt: [0.0]}}
    standUpTrajectoryFile: {type: string, default_value: "", description: "Planned stand-up (a wheeled-biped that
        cannot stand on a joint hold): YAML with a stand_up map of joint_names, time, position, velocity, effort,
        kp, kd and handover_time. When set, the bring-up runs with either floating-base source: Passive holds the
        idle pose for idleSeconds, then the MPC starts solving and the trajectory plays back (PD + feed-forward with
        its own gains); at handover_time the MPC takes over (Blend, then Locomotion), with the height reference
        restarted at the measured height. Empty keeps the humanoid stand-up."}
    idleSeconds: {type: double, default_value: 1.0, description: "With standUpTrajectoryFile: time to hold the idle
        pose before the planned stand-up starts [s]", validation: {gt_eq: [0.0]}}
    sitDownSeconds: {type: double, default_value: 3.0, description: "With a planned stand-up: smooth joint transition
        from the stopped MPC pose to the plan's kneeling idle pose [s].", validation: {gt: [0.0]}}
    sitDownBrakeSeconds: {type: double, default_value: 1.0, description: "Minimum zero-command MPC braking time
        before kneeling [s]. Refuses to kneel while base speed exceeds sitDownVelocityMax.", validation: {gt_eq: [0.0]}}
    sitDownVelocityMax: {type: double, default_value: 0.1, description: "Maximum horizontal base speed [m/s]
        before leaving MPC balance for the kneeling transition.", validation: {gt: [0.0]}}
    sitDownHeight: {type: double, default_value: 0.10, description: "Controller-only crouch height [m] reached
        under MPC balance before kneeling. May be below the operator height range; the posture table must cover it.",
        validation: {gt: [0.0]}}
    blendSeconds: {type: double, default_value: 0.5, description: "Time to blend the stand command into the first
        MPC commands [s], so the hand-over is not a torque step.", validation: {gt_eq: [0.0]}}
    tiltLimit: {type: double, default_value: 0.8, description: "Trunk tilt (angle between its vertical axis and
        the world's, from the IMU) past which the robot is treated as falling: the controller switches to joint
        damping and stays there [rad].", validation: {gt: [0.0]}}
  ocs2:
    interface:
      verbose: {type: bool, default_value: false, description: "Print the loaded MPC interface parameters"}
    codegen:
      verbose: {type: bool, default_value: true, description: "Verbose output during CppAD model generation"}
      recompileLibraries: {type: bool, default_value: true, description: "Force recompilation of the CppAD
          generated libraries"}
    model:
      robotName: {type: string, default_value: "g1", description: "Robot name used by the MPC model and CppAD codegen"}
      fixedJointNames: {type: string_array, default_value: [], description: "Joints excluded (locked) from the MPC
          model, e.g. wrists"}
      contactNames6DoF: {type: string_array, default_value: [], description: "Pinocchio frame names of the 6-DoF
          contact frames"}
      contactParentJointNames: {type: string_array, default_value: [], description: "Parent joints the contact frames
          are attached to"}
      contactGeometry:
        frameTranslation: {type: double_array, default_value: [0.035, 0.0, -0.035], description: "Translation from
            the contact parent joint to the contact frame [x, y, z]", validation: {fixed_size<>: [3]}}
        rectangle: {type: double_array, default_value: [0.09, -0.09, 0.03, -0.03], description: "Contact rectangle
            in the contact frame [x_max, x_min, y_max, y_min]", validation: {fixed_size<>: [4]}}
      jointArmature: {type: double_array, default_value: [], description: "Reflected rotor inertia of each MPC
          joint [kg m^2], in robot.jointNames order; added on the joint diagonal by Pinocchio's RNEA/CRBA. Empty =
          none. Baked into the generated CppAD libraries: set codegen.recompileLibraries after changing it"}
      jointFriction: {type: double_array, default_value: [], description: "Coulomb friction of each MPC joint [N m],
          in robot.jointNames order, e.g. the MJCF frictionloss. The joint dynamics rows (and the inverse-dynamics
          fallback) add f_c tanh(v / jointFrictionVelocity), so the planned motor torque overcomes it. Empty = none"}
      jointFrictionVelocity: {type: double, default_value: 0.05, description: "Joint speed [rad/s] over which the
          smoothed Coulomb friction reaches 76% of f_c (tanh(1))", validation: {gt: [0.0]}}
    solver:
      sqp:
        nThreads: {type: int, default_value: 4, description: "Number of solver threads", validation: {gt: [0]}}
        dt: {type: double, default_value: 0.02, description: "Multiple-shooting discretization step [s]",
            validation: {gt: [0.0]}}
        timeGrid:
          activate: {type: bool, default_value: false, description: "Use fine near-term and geometrically coarser far-term prediction steps"}
          maxStep: {type: double, default_value: 0.05, description: "Largest prediction step [s]; must be >= dt", validation: {gt: [0.0]}}
          growthFactor: {type: double, default_value: 1.2, description: "Step growth after the fine horizon", validation: {gt_eq: [1.0]}}
          fineHorizon: {type: double, default_value: 0.2, description: "Keep dt through this duration [s]; independent of the torque window", validation: {gt_eq: [0.0]}}
        sqpIteration: {type: int, default_value: 1, description: "SQP iterations per MPC solve", validation: {gt: [
              0]}}
        deltaTol: {type: double, default_value: 0.0001, description: "Convergence tolerance on the primal step"}
        g_max: {type: double, default_value: 0.01, description: "Maximum constraint violation for linesearch acceptance"}
        g_min: {type: double, default_value: 0.000001, description: "Constraint violation treated as converged"}
        projectStateInputEqualityConstraints: {type: bool, default_value: true, description: "Project state-input
            equality constraints"}
        printSolverStatistics: {type: bool, default_value: true, description: "Print solver statistics"}
        printSolverStatus: {type: bool, default_value: false, description: "Print solver status"}
        printLinesearch: {type: bool, default_value: false, description: "Print linesearch information"}
        useFeedbackPolicy: {type: bool, default_value: false, description: "Use the linear feedback policy instead
            of feedforward"}
        integratorType: {type: string, default_value: "RK4", description: "Sensitivity integrator type"}
        threadPriority: {type: int, default_value: 50, description: "Solver thread priority"}
      rollout:
        policyTimeOffset: {type: double, default_value: 0.005, description: "Look-ahead offset when evaluating
            the MPC policy at the current observation time [s]; not the ODE integration step", validation: {gt_eq: [0.0]}}
    mpc:
      solverType: {type: string, default_value: "sqp", description: "Optimization backend used by WB-ID MPC (SQP only)", validation: {one_of<>: [["sqp"]]}}
      mpcDesiredFrequency: {type: int, default_value: 80, description: "Desired MPC update frequency in Hz",
          validation: {gt: [0]}}
      mrtDesiredFrequency: {type: int, default_value: 1000, description: "Desired controller update frequency in
          Hz", validation: {gt: [0]}}
      timeHorizon: {type: double, default_value: 1.0, description: "MPC planning horizon in seconds",
          validation: {gt: [0.0]}}
      solutionTimeWindow: {type: double, default_value: -1.0, description: "MPC policy calculation time window",
        validation: {gt_eq: [-1.0]}}
      coldStart: {type: bool, default_value: false, description: "Reset the solver before every MPC solve"}
      debugPrint: {type: bool, default_value: false, description: "Print MPC debug information"}
    costs:
      qScaling: {type: double, default_value: 1.0, description: "Scaling applied to the whole Q matrix"}
      rScaling: {type: double, default_value: 0.001, description: "Scaling applied to the whole R matrix"}
      terminalCostScaling: {type: double, default_value: 3.0, description: "Scaling applied to the terminal cost
          Q_final"}
      q:
        basePose: {type: double_array, default_value: [15.0, 15.0, 1.5, 0.0, 5.0, 5.0], description: "Base pose
            weights [x, y, z, yaw, pitch, roll]; relative-twist mode ignores x/y/yaw pose errors", validation: {
            fixed_size<>: [6]}}
        baseVelocity: {type: double_array, default_value: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0], description: "Base velocity
            weights [vx, vy, vz, yaw rate, pitch rate, roll rate]; state translation velocity is world-aligned,
            angular entries are Euler ZYX rates. Horizontal tracking errors are compared in the respective pelvis
            heading frames.", validation: {fixed_size<>: [6]}}
        jointPositions: {type: double_array, default_value: [], description: "State cost diagonal, joint positions,
            index-aligned with robot.jointNames"}
        jointVelocities: {type: double_array, default_value: [], description: "State cost diagonal on the joint
            velocities, index-aligned with robot.jointNames"}
      qFinal:
        basePose: {type: double_array, default_value: [0.0, 0.0, 2.0, 0.0, 5.0, 5.0], description: "Terminal base
            pose weights [x, y, z, yaw, pitch, roll]", validation: {fixed_size<>: [6]}}
        baseVelocity: {type: double_array, default_value: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0], description: "Terminal
            base velocity weights, same ordering as q.baseVelocity", validation: {fixed_size<>: [6]}}
        jointPositions: {type: double_array, default_value: [], description: "Terminal state cost diagonal, joint
            positions, index-aligned with robot.jointNames"}
        jointVelocities: {type: double_array, default_value: [], description: "Terminal state cost diagonal on the
            joint velocities"}
      r:
        contactWrenches: {type: double_array, default_value: [0.05, 0.05, 0.01, 0.05, 0.05, 0.2, 0.05, 0.05,
              0.01, 0.05, 0.05, 0.2], description: "Input cost diagonal, contact wrenches [left fx,fy,fz,mx,my,mz,
            right fx,fy,fz,mx,my,mz]", validation: {fixed_size<>: [12]}}
        baseAccelerations: {type: double_array, default_value: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001],
            description: "Input cost diagonal on the base acceleration [linear xyz, Euler ZYX]; times ocs2.costs.rScaling",
          validation: {fixed_size<>: [6]}}
        jointAccelerations: {type: double_array, default_value: [], description: "Input cost diagonal on the joint
            accelerations, index-aligned with robot.jointNames; times ocs2.costs.rScaling"}
        jointTorques: {type: double_array, default_value: [], description: "Input cost diagonal on the joint torques,
            index-aligned with robot.jointNames; times ocs2.costs.rScaling"}
      taskSpaceFootCost:
        activate: {type: bool, default_value: true, description: "Register both foot task-space costs when configuring the controller"}
        weights: {type: double_array, default_value: [0.0, 0.0, 0.0, 1000.0, 1000.0, 0.0, 10.0,
              10.0, 0.0, 1.0, 1.0, 0.005], description: "Foot task-space kinematics weights [pos xyz, orientation
            xyz, lin vel xyz, ang vel xyz]", validation: {fixed_size<>: [12]}}
      captureFootPlacement:
        enabled: {type: bool, default_value: false, description: "Give the swing foot a flat-ground xy foothold
            reference through the foot cost; off leaves foot placement entirely to the optimizer"}
        gain: {type: double, default_value: 0.0, description: "Capture-point correction gain; 0 keeps the nominal
            foothold", validation: {gt_eq: [0.0]}}
        stepWidth: {type: double, default_value: 0.28, description: "Nominal lateral spacing between the feet [m]",
          validation: {gt: [0.0]}}
        maxAdjustment: {type: double, default_value: 0.10, description: "Bound on the capture-point correction
            [m]", validation: {gt: [0.0]}}
        trackingWeight: {type: double, default_value: 100.0, description: "xy foothold tracking weight in the
            foot cost", validation: {gt_eq: [0.0]}}
        projectionHorizon: {type: double, default_value: 0.0, description: "Capture-point propagation horizon
            about the stance foot [s], capped at the time to touchdown", validation: {gt_eq: [0.0]}}
        stepLengthGain: {type: double, default_value: 0.0, description: "Feedforward step ahead as a fraction of
            velocity x step period (spacing of the next two events)", validation: {gt_eq: [0.0]}}
        stanceTimeGain: {type: double, default_value: 0.5, description: "Raibert neutral point: land ahead of the
            predicted base by this fraction of velocity x the landing foot's scheduled stance time", validation: {
            gt_eq: [0.0]}}
        footCenterOffset: {type: double, default_value: 0.0, description: "Ankle-frame to support-centre offset
            along the heading [m]; the contact frame already sits at the sole centre"}
        currentSwingOnly: {type: bool, default_value: true, description: "Apply the foothold only until this
            foot's scheduled touchdown, not to its later swings within the horizon"}
      torsoTiltCost:
        activate: {type: bool, default_value: false, description: "Register the soft gravity-relative torso tilt and angular-motion cost at configuration"}
        linkName: {type: string, default_value: "torso_link", description: "Tracked torso frame whose local +Z points upright"}
        freeTiltAngle: {type: double, default_value: 0.08726646259971647, description: "Unpenalized torso tilt corridor in radians; widen or disable for intentional bending", validation: {gt: [0.0], lt: [1.5707963267948966]}}
        tiltWeight: {type: double, default_value: 10.0, description: "Weight on squared tilt beyond the free corridor; independent of qScaling and rScaling", validation: {gt_eq: [0.0]}}
        angularVelocityWeight: {type: double, default_value: 5.0, description: "Isotropic weight on squared angular velocity perpendicular to gravity; spin about gravity is unpenalized", validation: {gt_eq: [0.0]}}
      taskSpaceCosts:
        names: {type: string_array, default_value: [], description: "Named additional task-space kinematics tracking
            costs", validation: {unique<>: null}}
        __map_names:
          activate: {type: bool, default_value: true, description: "Register this named task-space cost when configuring the controller"}
          linkName:
            type: string
            default_value: ""
            description: "Pinocchio link tracked by this task-space cost"
          weights:
            type: double_array
            default_value: []
            description: "Task-space kinematics weights [pos xyz, orientation xyz, lin vel xyz, ang vel xyz]"
            validation:
              fixed_size<>: [12]
      legTorqueCost:
        activate: {type: bool, default_value: true, description: "Register both leg external-load costs when configuring the controller"}
        scaling: {type: double, default_value: 0.0001, description: "Scaling applied to the leg external-torque
            cost weights"}
        leftActiveJointNames: {type: string_array, default_value: [], description: "Joints of the left-leg external
            torque quadratic cost"}
        leftWeights: {type: double_array, default_value: [], description: "Weights of the left-leg external torque
            quadratic cost (pre-scaling)"}
        rightActiveJointNames: {type: string_array, default_value: [], description: "Joints of the right-leg external
            torque quadratic cost"}
        rightWeights: {type: double_array, default_value: [], description: "Weights of the right-leg external torque
            quadratic cost (pre-scaling)"}
    constraints:
      footMotionEquality:
        activate: {type: bool, default_value: true, description: "Enable stance and swing foot acceleration equalities; disable only for diagnostic ablation"}
        positionErrorGain_z: {type: double, default_value: 0.5, description: "Stance foot vertical position error
            feedback gain"}
        orientationErrorGain: {type: double, default_value: 20.0, description: "Stance foot orientation error feedback
            gain"}
        linearVelocityErrorGain_z: {type: double, default_value: 1.0, description: "Stance foot vertical linear
            velocity error feedback gain"}
        linearVelocityErrorGain_xy: {type: double, default_value: 1.0, description: "Stance foot horizontal linear
            velocity error feedback gain"}
        angularVelocityErrorGain: {type: double, default_value: 1.0, description: "Stance foot angular velocity
            error feedback gain"}
        linearAccelerationErrorGain_z: {type: double, default_value: 0.0, description: "Stance foot vertical linear
            acceleration error feedback gain"}
        linearAccelerationErrorGain_xy: {type: double, default_value: 0.0, description: "Stance foot horizontal
            linear acceleration error feedback gain"}
        angularAccelerationErrorGain: {type: double, default_value: 0.0, description: "Stance foot angular acceleration
            error feedback gain"}
      wheelContact:
        activate: {type: bool, default_value: false, description: "Rolling wheels instead of planted feet: the
            contact frames sit at the tire centres on the wheel links (contactParentJointNames are the wheel
            joints). Per wheel in contact: no longitudinal slip and no gap at the tire contact point (acceleration
            level) and moment = rho x force; one lateral no-slip row shared by the wheels in contact; a swing wheel
            follows the swing height. Requires footMotionEquality and contactMomentXY off. Wheel joints get no
            position bounds"}
        radius: {type: double, default_value: 0.055, description: "Tire radius [m]", validation: {gt: [0.0]}}
        axleAxis: {type: double_array, default_value: [0.0, 0.0, 1.0], description: "Wheel axle direction in the
            contact frame", validation: {fixed_size<>: [3]}}
        normalPositionGain: {type: double, default_value: 50.0, description: "Gap (and swing height) position
            feedback gain"}
        normalVelocityGain: {type: double, default_value: 50.0, description: "Gap rate (and swing vertical velocity)
            feedback gain"}
        tangentialVelocityGain: {type: double, default_value: 50.0, description: "Tread slip velocity feedback gain"}
        normalAccelerationGain: {type: double, default_value: 1.0, description: "Gap acceleration multiplier; keep
            nonzero"}
        tangentialAccelerationGain: {type: double, default_value: 1.0, description: "Tread slip acceleration
            multiplier; keep nonzero"}
      inverseDynamics:
        activate: {type: bool, default_value: true, description: "Enable floating-base and joint RNEA equalities; disabling removes physical consistency and uses RNEA feedforward instead of policy torque"}
        torqueConstraintNodes: {type: int, default_value: 3, description: "Nodes from the start of the horizon carrying
            the joint-torque rows and torque limits; <= 0 for all"}
      frictionCone:
        activate: {type: bool, default_value: true, description: "Enable contact friction-cone soft penalties"}
        frictionCoefficient: {type: double, default_value: 0.4, description: "Contact friction coefficient",
            validation: {gt: [0.0]}}
        mu: {type: double, default_value: 0.2, description: "Relaxed barrier mu of the friction cone soft constraint"}
        delta: {type: double, default_value: 5.0, description: "Relaxed barrier delta of the friction cone soft
            constraint"}
      contactMomentXY:
        activate: {type: bool, default_value: true, description: "Enable contact center-of-pressure soft penalties"}
        mu: {type: double, default_value: 0.6, description: "Relaxed barrier mu of the contact moment XY soft constraint"}
        delta: {type: double, default_value: 0.03, description: "Relaxed barrier delta of the contact moment XY
            soft constraint"}
      jointPositionLimits:
        activate: {type: bool, default_value: true, description: "Enable joint position soft penalties using URDF lower and upper bounds"}
        mu: {type: double, default_value: 1200.0, description: "Barrier mu of the joint limits soft constraint"}
        delta: {type: double, default_value: 0.1, description: "Barrier delta of the joint limits soft constraint"}
      armSelfCollision:
        activate: {type: bool, default_value: false, description: "Enable arm versus torso/pelvis/head sphere soft penalties in every gait; no arm-arm or arm-leg pairs"}
        minimumDistance: {type: double, default_value: 0.015, description: "Required sphere surface clearance [m] before the soft penalty; not a hard safety guarantee", validation: {gt_eq: [0.0]}}
        implementation: {type: string, default_value: "polynomial", description: "Compact-support polynomial penalty, or relaxed logarithmic barrier", validation: {one_of<>: [["rbf", "polynomial"]]}}
        mu: {type: double, default_value: 3000.0, description: "Penalty strength; log and polynomial implementations use different scales", validation: {gt: [0.0]}}
        delta: {type: double, default_value: 0.02, description: "Relaxation distance [m]; RBF curvature inside the boundary is mu/delta^2", validation: {gt: [0.0]}}
        arms:
          names: {type: string_array, default_value: [], description: "Named upper-arm, forearm and hand spheres", validation: {unique<>: null}}
          __map_names:
            linkName: {type: string, default_value: "", description: "Pinocchio link frame for this arm sphere"}
            center: {type: double_array, default_value: [0.0, 0.0, 0.0], description: "Sphere center in link-local coordinates [m]", validation: {fixed_size<>: [3]}}
            radius: {type: double, default_value: 0.05, description: "Sphere radius [m]", validation: {gt: [0.0]}}
        bodies:
          names: {type: string_array, default_value: [], description: "Named torso, pelvis and head spheres; each arm sphere is checked against each body sphere", validation: {unique<>: null}}
          __map_names:
            linkName: {type: string, default_value: "", description: "Pinocchio link frame for this body sphere"}
            center: {type: double_array, default_value: [0.0, 0.0, 0.0], description: "Sphere center in link-local coordinates [m]", validation: {fixed_size<>: [3]}}
            radius: {type: double, default_value: 0.10, description: "Sphere radius [m]", validation: {gt: [0.0]}}
      legSelfCollision:
        activate: {type: bool, default_value: true, description: "Enable foot/knee sphere penalties outside double support and optional lateral separation in all modes"}
        minimumLateralSeparation: {type: double, default_value: 0.0, description: "Minimum signed left-minus-right foot-center separation along pelvis-heading lateral axis [m]; zero disables this extra soft penalty",
            validation: {gt_eq: [0.0]}}
        leftAnkleFrame: {type: string, default_value: "left_ankle_roll_joint", description: "Left ankle frame of
            the foot collision constraint"}
        rightAnkleFrame: {type: string, default_value: "right_ankle_roll_joint", description: "Right ankle frame
            of the foot collision constraint"}
        footCollisionSphereRadius: {type: double, default_value: 0.065, description: "Foot collision sphere radius
            [m]"}
        leftKneeFrame: {type: string, default_value: "left_knee_joint", description: "Left knee frame of the collision
            constraint"}
        rightKneeFrame: {type: string, default_value: "right_knee_joint", description: "Right knee frame of the
            collision constraint"}
        kneeCollisionSphereRadius: {type: double, default_value: 0.07, description: "Knee collision sphere radius
            [m]"}
        mu: {type: double, default_value: 30000.0, description: "Barrier mu of the collision soft constraint"}
        delta: {type: double, default_value: 0.05, description: "Barrier delta of the collision soft constraint"}
      jointTorqueLimits:
        activate: {type: bool, default_value: true, description: "Enable OCP torque-limit soft penalties inside the torque window; does not disable runtime feedforward clipping"}
        torqueScaling: {type: double, default_value: 1.0, description: "Fraction of URDF or override torque limits used by both the OCP penalty and runtime feedforward clipping",
            validation: {gt: [0.0], lt_eq: [1.0]}}
        limits: {type: double_array, default_value: [], description: "Symmetric torque bounds [Nm] in robot.jointNames
            order, shared by the OCP soft penalty inside the torque window and runtime feedforward clipping.
            Omit this parameter to use URDF joint effort limits; a full array overrides them.
            Do not supply an explicit empty YAML array in Jazzy. Limits must be finite and positive.
            Does not clamp the final effort_pd feedback-plus-feedforward torque."}
        mu: {type: double, default_value: 0.1, description: "Relaxed log barrier strength of the torque limits"}
        delta: {type: double, default_value: 5.0, description: "Relaxed log barrier delta of the torque limits [Nm]"}
      jointVelocityLimits:
        activate: {type: bool, default_value: true, description: "Enable joint velocity soft penalties using scaled URDF velocity bounds"}
        velocityScaling: {type: double, default_value: 1.0, description: "Fraction of URDF joint velocity limits used by the OCP soft penalty; use activate to disable",
            validation: {gt: [0.0], lt_eq: [1.0]}}
        mu: {type: double, default_value: 0.1, description: "Relaxed log barrier mu of the joint velocity limits"}
        delta: {type: double, default_value: 1.0, description: "Relaxed log barrier delta of the joint velocity
            limits [rad/s]"}
      swingFootZeroWrench:
        activate: {type: bool, default_value: true, description: "Enable zero contact-wrench equalities for swing feet; disable only for diagnostic ablation"}
    reference:
      groundHeight:
        useEstimate: {type: bool, default_value: false, description: "Use stance-foot FK height for the ordinary
            swing/support-height reference instead of fixed z=0. Requires a floating-base estimator that does
            not itself pin contact heights to zero; does not supply a terrain map or surface normals."}
        maxStepPerSolve: {type: double, default_value: 0.01, description: "Bound [m] on the support-height reference
            change per solver iteration, limiting reference jumps at contact transitions", validation: {gt: [0.0]}}
      targetDisplacementVelocity: {type: double, default_value: 0.5, description: "Nominal displacement velocity
          used for target arrival time [m/s]"}
      targetRotationVelocity: {type: double, default_value: 0.5, description: "Nominal rotation velocity used for
          target arrival time [rad/s]"}
      maxDisplacementVelocityX: {type: double, default_value: 2.4, description: "Maximum commanded base velocity
          in x [m/s]"}
      maxDisplacementVelocityY: {type: double, default_value: 1.2, description: "Maximum commanded base velocity
          in y [m/s]"}
      minBaseHeight: {type: double, default_value: 0.3925, description: "Lowest commanded pelvis height above ground
          [m]: the base command GUI's slider bottom and the clamp of commanded heights (before the height rate limit,
          so a reset to a lower measured height still ramps up)", validation: {gt: [0.0]}}
      maxBaseHeight: {type: double, default_value: 1.1925, description: "Highest commanded pelvis height above ground
          [m], as minBaseHeight", validation: {gt: [0.0]}}
      maxRotationVelocity: {type: double, default_value: 1.0, description: "Maximum commanded yaw rate [rad/s]"}
      velocityCommandRateLimits: {type: double_array, default_value: [0.1, 0.08, 0.05, 0.1], description: "Physical
          slew limits [ax, ay (m/s^2), height rate (m/s), yaw acceleration (rad/s^2)] applied to the scaled walking
          command (base_twist/terrain_walk), next to the maxDisplacementVelocity/maxRotationVelocity scaling;
          zero disables an axis", validation: {fixed_size<>: [4], element_bounds<>: [0.0, 100.0]}}
      takeoverHeightRate: {type: double, default_value: 0.0, description: "Height rate [m/s] of the reference's rise
          from the measured height at MPC takeover (after a planned stand-up) to the commanded height;
          velocityCommandRateLimits applies once it arrives. 0: velocityCommandRateLimits throughout",
          validation: {bounds<>: [0.0, 100.0]}}
      defaultBaseHeight: {type: double, default_value: 0.7925, description: "Default pelvis height above ground
          [m]"}
      basePosePositionTolerance: {type: double, default_value: 0.02, description: "Planar position error below which
          a base pose target no longer requests walking [m]", validation: {gt_eq: [0.0]}}
      basePoseOrientationTolerance: {type: double, default_value: 0.03, description: "Yaw error below which a base
          pose target no longer requests rotation [rad]", validation: {gt_eq: [0.0]}}
      defaultJointState: {type: double_array, default_value: [], description: "Default (standing) joint configuration,
          index-aligned with robot.jointNames. The ARM entries are also the nominal arm posture the arms hold while
          walking: with the swing below disabled, this is the whole arm reference. Keep it inside the self-collision-free
          envelope - armSelfCollision is a soft approximate safeguard, not a hard collision guarantee."}
      postureHeights: {type: double_array, default_value: [], description: "Optional base heights [m], strictly
          increasing, for postureJointStates: the joint posture reference is interpolated at the target base height,
          and target heights are clamped to [first, last]. Empty: defaultJointState at every height"}
      postureJointStates: {type: double_array, default_value: [], description: "Joint states for postureHeights,
          one row of robot.jointNames per height, row-major"}
      postureTableFile: {type: string, default_value: "", description: "Optional YAML with a posture_table map of
          joint_names (equal to robot.jointNames), heights and joint_states (one row per height), loaded instead of
          postureHeights/postureJointStates, which must then be empty. Generated offline, e.g.
          config/upkie/compute_posture_table.py."}
      armSwing:
        jointNames: {type: string_array, default_value: [], description: "Reference joints in order [left shoulder
            pitch, right shoulder pitch, left elbow, right elbow]. Required by model joint-index setup even
            when arm swing is disabled; empty for a robot without arms (arm swing must then stay disabled)."}
        enabled: {type: bool, default_value: false, description: "Superimpose a gait-phase-locked arm swing on the
            nominal arm posture. OFF by default, which keeps the nominal posture except for external arm
            targets. This is reference generation, not an angular-momentum stabilization objective."}
        shoulderPitchAmplitude: {type: double, default_value: 0.15, description: "Shoulder-pitch swing amplitude
            per unit commanded forward speed [rad/(m/s)]", validation: {gt_eq: [0.0]}}
        elbowAmplitude: {type: double, default_value: 0.15, description: "Elbow swing amplitude per unit commanded
            forward speed [rad/(m/s)]", validation: {gt_eq: [0.0]}}
        phaseOffset: {type: double, default_value: 0.15, description: "Shifts the swing relative to the gait phase,
            in fractions of a cycle"}
        maxOffset: {type: double, default_value: 0.6, description: "Hard bound on the swing offset away from the
            nominal posture [rad]. Sized from the collision-free envelope measured on the G1 model: at the shipped
            nominal (shoulder roll +-0.20, elbow 1.20) a +-0.6 rad shoulder-pitch excursion clears torso, pelvis
            and hips with no interpenetration and no near-miss inside a 20 mm margin. The optional armSelfCollision
            penalty does not replace this reference-excursion bound.",
            validation: {gt: [0.0]}}
    gait:
      phaseTransitionStanceTime: {type: double, default_value: 0.0, description: "Minimum stance time inserted at
          phase transitions [s]"}
      stairClimbingFile: {type: string, default_value: "", description: "YAML file with the fixed-sequence stair
          climbing parameters, see config/terrains/stair_climbing/. Empty disables the stair_climb target mode."}
      terrainWalkingFile: {type: string, default_value: "", description: "YAML file with the online terrain-aware
          walking parameters (terrain geometry + planner settings), see config/terrains/terrain_walking/.
          Empty disables the terrain_walk target mode."}
      initialModeSequence: {type: string_array, default_value: ["STANCE", "STANCE"], description: "Initial mode
          schedule mode sequence"}
      initialEventTimes: {type: double_array, default_value: [0.5], description: "Initial mode schedule event times
          [s]"}
      defaultModeSequence: {type: string_array, default_value: ["STANCE"], description: "Default mode sequence template
          applied after the initial schedule"}
      defaultSwitchingTimes: {type: double_array, default_value: [0.0, 0.5], description: "Switching times of the
          default mode sequence template [s]"}
      swingTrajectory:
        liftOffVelocity: {type: double, default_value: 0.05, description: "Swing foot lift-off vertical velocity [m/s]"}
        touchDownVelocity: {type: double, default_value: -0.0, description: "Swing foot touch-down vertical velocity
            [m/s]"}
        swingHeight: {type: double, default_value: 0.08, description: "Swing apex height [m]"}
        touchDownHeightOffset: {type: double, default_value: -0.001, description: "Touch-down height offset [m]"}
        swingTimeScale: {type: double, default_value: 0.4, description: "Swing durations shorter than this are scaled
            down [s]"}
        impactProximityFactorLiftOffVelocity: {type: double, default_value: -0.15, description: "Impact proximity
            factor at lift-off velocity"}
        impactProximityFactorTouchDownVelocity: {type: double, default_value: 0.3, description: "Impact proximity
            factor at touch-down velocity"}
        impactProximityFactorMidPointValue: {type: double, default_value: 0.0, description: "Impact proximity factor
            mid-point value"}
      templates:
        names: {type: string_array, default_value: [], description: "Names of the gait templates, each defined as
            ocs2.gait.templates.<name>. The gait ladder and the stair/terrain modes select templates by these names.",
            validation: {unique<>: null}}
        __map_names:
          swingHeight: {type: double, default_value: -1.0, description: "Swing clearance [m] for this gait; -1 inherits gait.swingTrajectory.swingHeight. Short swings still use swingTimeScale.",
              validation: {gt_eq: [-1.0]}}
          modeSequence: {type: string_array, default_value: [], description: "The template's N modes in order: STANCE
              (both feet in contact), LF (left foot in contact, right swings), RF (right foot in contact) or FLY (no contact)",
              validation: {subset_of<>: [["STANCE", "LF", "RF", "FLY"]]}}
          switchingTimes: {type: double_array, default_value: [], description: "N+1 increasing switching times of the
              template's N modes [s]; the template repeats with period last - first"}
      transitions:
        minDwellTime: {type: double, default_value: 0.2, description: "Minimum time between two gait changes [s]",
            validation: {gt_eq: [0.0]}}
        switchDelayHorizonFraction: {type: double, default_value: 0.7, description: "A new gait starts at the first
            contact event after initTime + this fraction of the MPC horizon", validation: {gt_eq: [0.0], lt_eq: [1.0]}}
        ladder: {type: string_array, default_value: [], description: "Gaits the velocity-based selection steps through,
            slowest to fastest and one rung per change. The first must be stance; each must be in ocs2.gait.templates.names
            and defined as ocs2.gait.transitions.<gait>.", validation: {unique<>: null}}
        __map_ladder:
          linearVelocity: {type: double_array, default_value: [], description: "Command band [min, max] on |vx| and
              |vy| [m/s] this rung serves: go up when either exceeds max, down when both are below min", validation: {
                fixed_size<>: [2]}}
          yawRate: {type: double_array, default_value: [], description: "Command band [min, max] on |yaw rate| [rad/s]
              this rung serves", validation: {fixed_size<>: [2]}}
          measuredMargin: {type: double_array, default_value: [], description: "[linear m/s, yaw rad/s]: go up only
              once the measured speed exceeds max - margin, down only once it is below min + margin", validation: {
                fixed_size<>: [2], lower_element_bounds<>: [0.0]}}
  visualization:
    frameId: {type: string, default_value: "world", description: "Visualization marker frame"}
    update_rate: {type: double, default_value: 30.0, description: "Performance visualization update rate",
        validation: {gt_eq: [0.0]}}
    optimizedStateRobotModelsActivate: {type: bool, default_value: true,
        description: "Enable subscriber-driven future and terminal robot mesh ghosts"}
    optimizedStateRobotModelsInterval: {type: double, default_value: 0.2,
        description: "Nominal temporal spacing of mesh ghosts across the actual MPC policy horizon [s]",
        validation: {gt: [0.0]}}
    collisionSpheres:
      activate: {type: bool, default_value: false, description: "Draw enabled arm/body and leg collision spheres at the observed state"}
      markerTopic: {type: string, default_value: "/performance_visualization/collisionSpheres",
          description: "Best-effort collision sphere marker topic"}
      alpha: {type: double, default_value: 0.25, description: "Collision sphere opacity",
          validation: {gt: [0.0], lt_eq: [1.0]}}
    trajectory:
      activate: {type: bool, default_value: true, description: "Enable optimized trajectory visualization"}
      markerTopic: {type: string, default_value: "/performance_visualization/optimizedStateTrajectory",
          description: "Topic for optimized trajectory visualization markers"}
      frame_names: {type: string_array, default_value: [], description: "Frame names to visualize along the optimized
          MPC trajectory", validation: {unique<>: null}}
      lineWidth: {type: double, default_value: 0.005, description: "Line width of the optimized trajectory marker",
        validation: {gt_eq: [0.0]}}
      pointScale: {type: double, default_value: 0.01, description: "Point scale of the optimized trajectory samples",
        validation: {gt_eq: [0.0]}}
